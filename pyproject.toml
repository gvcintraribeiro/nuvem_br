[project]
name = "nuvem-br"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.1",
    "numpy>=2.5.5",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
]

# Layout src/: torna o pacote nuvem_br importável (uv run main.py).
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
