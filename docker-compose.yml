services:
  postgres:
    image: postgres:16
    container_name: nuvem_br_postgres
    environment:
      POSTGRES_USER: nuvem
      POSTGRES_PASSWORD: nuvem_local
      POSTGRES_DB: nuvem_br
    ports:
      # Exposto apenas na máquina local.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts .sql desta pasta rodam na primeira criação do banco (DDL de referência).
      - ./sql:/docker-entrypoint-initdb.d:ro
      # CSVs disponíveis dentro do container em /data (para COPY).
      - ./data:/data:ro
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: nuvem_br_metabase
    depends_on:
      - postgres
    ports:
      # Exposto apenas na máquina local: http://localhost:3000
      - "127.0.0.1:3000:3000"
    volumes:
      # Metadados do Metabase (usuários, dashboards, perguntas) em H2; uso local.
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    restart: unless-stopped

volumes:
  pgdata:
  metabase_data:
